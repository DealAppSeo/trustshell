# Sandbox missions (Agent Immune System, IS-P0, defensive half), with real Docker.
#
# One BENIGN worker runs in a disposable container. The harness reads the profile back from
# `docker inspect` before the worker starts, destroys the container, moves the outbox through the
# airlock, asks the promotion gate (its own key) to promote, revokes the mission token, and signs a
# receipt. A SEPARATE step verifies that receipt using only the two public keys.
#
# The receipt carries a TrustMedic passport (IS-P1-10/11) the harness measured itself (docker inspect, the
# pinned image, the Guard policy, the grant) and signed. The `passports` job compares the runc and runsc
# passports: only `runtime` may differ, plus `attestation` because each leg makes a fresh harness key.
# A matching passport does not prove the worker's reasoning or memory is safe; the comparison says so.
#
# C2: each leg also runs `trustshell run --sandbox` through the built CLI on a benign probe, promotes its outbox
# with `trustshell sandbox promote`, and checks from the host that the result arrived only in the trusted store,
# the project directory is byte-identical, the container is gone, and the receipt and passport verify.
#
# What this does NOT test: the restrictions against an active hostile worker. Those tests await a
# scope decision; the receipt's `not_measured` list says so.
#
# No secrets: the signing keys are generated fresh in RUNNER_TEMP and deleted before the run step exits.
name: sandbox-mission

on:
  pull_request:
    paths:
      - 'src/sandbox/**'
      - 'src/lib/install-key.ts'
      - 'src/lib/jcs.ts'
      - 'src/lib/guardrails.ts'
      - 'src/cli/guard.ts'
      - 'src/cli/index.ts'
      - 'tests/sandbox-*.test.ts'
      - '.github/workflows/sandbox-mission.yml'
  push:
    branches: [main]
    paths:
      - 'src/sandbox/**'
      - 'src/lib/install-key.ts'
      - 'src/lib/jcs.ts'
      - 'src/lib/guardrails.ts'
      - 'src/cli/guard.ts'
      - 'src/cli/index.ts'
      - 'tests/sandbox-*.test.ts'
      - '.github/workflows/sandbox-mission.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mission:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runtime: [runc, runsc]
    env:
      RUNTIME: ${{ matrix.runtime }}
      PINNED_DIGEST: sha256:fe4f6d74e20370acb04ad889077d14d0f64a9c8ea6a42bc60cddf1e844699914
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # the job never pushes; keep the token off disk

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts # PR code must not run dependency install scripts

      - name: Unit tests (no Docker needed)
        run: npx jest tests/sandbox-

      # gVisor from its official apt repository (https://gvisor.dev/docs/user_guide/install/),
      # registered with dockerd by `runsc install`.
      - name: Install gVisor (runsc) and register it with Docker
        if: matrix.runtime == 'runsc'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y apt-transport-https ca-certificates curl gnupg
          curl -fsSL https://gvisor.dev/archive.key | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" \
            | sudo tee /etc/apt/sources.list.d/gvisor.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y runsc
          runsc --version
          sudo runsc install
          sudo systemctl restart docker

      - name: Container runtimes Docker reports
        run: |
          docker version --format 'server {{.Server.Version}}'
          docker info --format 'runtimes: {{range $k, $v := .Runtimes}}{{$k}} {{end}}'

      - name: Re-verify the pinned image digest
        run: |
          set -euo pipefail
          # What the tag points to today (informational; a lookup failure is reported, not fatal).
          live=$( (docker pull -q node:22-alpine > /dev/null && docker image inspect node:22-alpine --format '{{join .RepoDigests " "}}') || echo "lookup failed")
          echo "pinned:              node@$PINNED_DIGEST"
          echo "node:22-alpine now:  $live"
          case "$live" in *"@$PINNED_DIGEST"*) echo "tag still points at the pin" ;; *) echo "::notice::node:22-alpine no longer matches the pin (or the lookup failed); the mission still runs the pinned digest" ;; esac
          docker pull -q "node:22-alpine@$PINNED_DIGEST"

      - name: Compile the mission CLI
        run: npx tsc --outDir "$RUNNER_TEMP/sbx" --rootDir src --module commonjs --target es2020 --esModuleInterop --skipLibCheck --strict --types node src/sandbox/cli.ts

      - name: Run the mission, airlock, promotion gate, destroy + revoke, and sign the receipt
        run: node "$RUNNER_TEMP/sbx/sandbox/cli.js" run --runtime "$RUNTIME" --out "$RUNNER_TEMP/out" --work "$RUNNER_TEMP"

      # Separate step: only the receipt, the two public keys and the trusted store. The private keys
      # were deleted when the run step exited.
      - name: Verify the receipt independently (public keys only)
        run: |
          set -euo pipefail
          test ! -e "$RUNNER_TEMP"/ts-sbx-* || { echo "private key work dir still present"; exit 1; }
          node "$RUNNER_TEMP/sbx/sandbox/cli.js" verify \
            --receipt "$RUNNER_TEMP/out/receipt.json" \
            --keys "$RUNNER_TEMP/out/public-keys.json" \
            --store "$RUNNER_TEMP/out/trusted-store" \
            --demo

      # C2: `trustshell run --sandbox` through the real CLI, on a BENIGN probe that writes what it sees (its network
      # interfaces and mounts) to its outbox. Guard decides first (the probe is pinned, C5; plain run is refused once
      # require-sandbox is on). Everything below is checked from the HOST. A functional check of the configured
      # profile, not an attack: hostile-command tests are C15 and await a scope decision.
      - name: Build the trustshell CLI
        run: npm run sdk:build

      - name: trustshell run --sandbox, then an explicit promote, checked from the host
        env:
          TRUSTSHELL_HOME: ${{ runner.temp }}/ts-home
        run: |
          set -euo pipefail
          ts() { node "$GITHUB_WORKSPACE/dist/cli/index.js" "$@"; }
          proj="$RUNNER_TEMP/proj"
          mkdir -p "$proj/sub"
          cd "$proj"
          printf 'project notes\n' > notes.txt
          printf '[1,2,3]\n' > sub/data.json
          printf '%s\n' \
            'out=/mission/outbox' \
            'echo "sandboxed result" > "$out/result.txt"' \
            "sed -n 's/^ *\\([^:]*\\):.*/\\1/p' /proc/net/dev > \"\$out/net.txt\"" \
            'cat /proc/mounts > "$out/mounts.txt"' \
            'ls /mission/input > "$out/input-listing.txt"' > probe.sh
          cat probe.sh
          snap() { (cd "$proj" && find . -type f -print0 | sort -z | xargs -0 sha256sum); }
          snap > "$RUNNER_TEMP/before.sha"

          ts guard init
          ts guard allow tool:sh --script probe.sh
          ts guard allow tool:sandbox
          ts guard require-sandbox on
          set +e; ts run --tool sh -- sh probe.sh; rc=$?; set -e
          test "$rc" = 5 || { echo "plain run was not refused under require-sandbox (exit $rc)"; exit 1; }

          ts run --sandbox --runtime "$RUNTIME" --tool sh -- sh probe.sh
          id=$(ls "$TRUSTSHELL_HOME/sandbox/missions")
          mdir="$TRUSTSHELL_HOME/sandbox/missions/$id"
          echo "mission $id"
          test -z "$(docker ps -aq --filter "name=ts-mission-$id")" || { echo "container still present"; exit 1; }
          test ! -e "$mdir/trusted-store" || { echo "something was promoted before the owner asked"; exit 1; }
          snap | diff "$RUNNER_TEMP/before.sha" - || { echo "the host working directory changed"; exit 1; }

          ts sandbox promote "$id" --json > "$RUNNER_TEMP/promote.json"
          node -e 'for (const p of require(process.argv[1]).promoted) console.log(p.name + " " + p.path)' "$RUNNER_TEMP/promote.json" | tee "$RUNNER_TEMP/promoted.txt"
          path_of() { awk -v n="$1" '$1 == n { print $2 }' "$RUNNER_TEMP/promoted.txt"; }
          # The result came home, and only into the trusted store.
          test "$(cat "$(path_of result.txt)")" = "sandboxed result"
          test ! -e "$proj/result.txt"
          case "$(path_of result.txt)" in "$mdir/trusted-store/"*) ;; *) echo "result is not in the trusted store"; exit 1 ;; esac
          echo "interfaces seen inside:"; cat "$(path_of net.txt)"
          test "$(sort -u "$(path_of net.txt)" | tr '\n' ' ')" = "lo " || { echo "an interface other than lo was visible"; exit 1; }
          echo "input mount inside:"; grep ' /mission/input ' "$(path_of mounts.txt)"
          grep ' /mission/input ' "$(path_of mounts.txt)" | grep -qw ro || { echo "the input was not mounted read-only"; exit 1; }
          test "$(cat "$(path_of input-listing.txt)" | tr '\n' ' ')" = "notes.txt probe.sh sub "
          snap | diff "$RUNNER_TEMP/before.sha" - || { echo "the host working directory changed"; exit 1; }
          test -z "$(docker ps -aq --filter "name=ts-mission-$id")"

          # Receipt and passport, verified with the public keys only, against the trusted store.
          node "$RUNNER_TEMP/sbx/sandbox/cli.js" verify --receipt "$mdir/receipt.json" --keys "$mdir/public-keys.json" --store "$mdir/trusted-store"
          mkdir -p "$RUNNER_TEMP/out/run-sandbox"
          cp "$mdir/receipt.json" "$mdir/public-keys.json" "$mdir/passport.json" "$RUNNER_TEMP/out/run-sandbox/"
          rm -rf "$TRUSTSHELL_HOME" # its two private keys

      - name: Upload the receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sandbox-mission-receipt-${{ matrix.runtime }}
          path: ${{ runner.temp }}/out
          if-no-files-found: warn

  # Both legs ran the same mission. Their passports must match everywhere except the runtime, and the
  # harness key (generated per run). Anything else is drift and fails the job.
  passports:
    needs: mission
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Compile the mission CLI
        run: npx tsc --outDir "$RUNNER_TEMP/sbx" --rootDir src --module commonjs --target es2020 --esModuleInterop --skipLibCheck --strict --types node src/sandbox/cli.ts

      - uses: actions/download-artifact@v8
        with:
          pattern: sandbox-mission-receipt-*
          path: ${{ runner.temp }}/receipts

      - name: Compare the runc and runsc passports
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/sbx/sandbox/cli.js" compare \
            --a "$RUNNER_TEMP/receipts/sandbox-mission-receipt-runc/receipt.json" \
            --b "$RUNNER_TEMP/receipts/sandbox-mission-receipt-runsc/receipt.json" \
            --allow runtime,attestation
