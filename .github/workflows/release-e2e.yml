# Installs the packed release into an empty folder and drives it as a new developer would: no account, no key,
# no secret of ours. It runs on each operating system because the commands have to work the same in each shell.
name: release-e2e

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # 35, not 20. Measured 2026-11-10 over the last 15 runs: passing Windows jobs took 17.4 to 19.5 min,
    # and 6 were cancelled at 20.2 min while every step so far was passing. The limit, not the code, failed them.
    # 35 still stops a real hang.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Exit 2 means NOT_CHECKED: shared runner addresses are often rate-limited by GitHub's anonymous API. That is
      # reported as a warning and never as a pass; the step summary lists which steps did not run.
      - name: Clean-install E2E
        shell: bash
        run: |
          set +e
          node scripts/release-e2e.mjs --out e2e-out
          code=$?
          node scripts/release-e2e-summary.mjs e2e-out >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" = "2" ]; then echo "::warning::some steps were NOT_CHECKED; see the summary"; exit 0; fi
          exit $code
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-${{ matrix.os }}
          path: e2e-out
          if-no-files-found: ignore

  # The same E2E on what developers actually install: the npm registry tarball of the latest release, checked
  # byte for byte against the registry's integrity hash before it runs. The job above tests this checkout; this
  # one tests the published package, which is the thing an outside developer gets.
  published:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Measured: Windows runs of this E2E took 21-24 minutes and were cut off at 20 (see #702).
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Download the published package and check its bytes
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          v=$(npm view @hyperdag/trustshell version)
          want=$(npm view "@hyperdag/trustshell@$v" dist.integrity)
          d="$RUNNER_TEMP/published"; mkdir -p "$d"
          name=$(npm pack "@hyperdag/trustshell@$v" --pack-destination "$d" --json | node -e 'let s="";process.stdin.on("data",(c)=>(s+=c)).on("end",()=>process.stdout.write(JSON.parse(s)[0].filename))')
          # The control is built in: a copy with one changed byte must fail the same comparison.
          node -e '
            const fs = require("fs"), c = require("crypto"), [f, want] = process.argv.slice(1);
            const h = (b) => "sha512-" + c.createHash("sha512").update(b).digest("base64");
            const b = fs.readFileSync(f);
            if (h(b) !== want) { console.error("::error::the downloaded tarball does not match the registry integrity"); process.exit(1); }
            const x = Buffer.from(b); x[100] ^= 1;
            if (h(x) === want) { console.error("::error::the integrity check cannot tell a changed byte apart"); process.exit(1); }
            console.log("registry integrity matches; a one-byte change is caught");' "$d/$name" "$want"
          echo "tarball=$d/$name" >> "$GITHUB_OUTPUT"
          echo "Tested the published package @hyperdag/trustshell@$v ($want)" >> "$GITHUB_STEP_SUMMARY"
      # This job is the proof, so it is stricter than the one above: NOT_CHECKED fails it (a green check must
      # not stand for steps that never ran), and an empty or wrong tarball path cannot fall back to the checkout.
      - name: Clean-install E2E on the published package
        shell: bash
        run: |
          t="${{ steps.pkg.outputs.tarball }}"
          if [ ! -f "$t" ] || [ "${t%.tgz}" = "$t" ]; then echo "::error::no published tarball at '$t'"; exit 1; fi
          set +e
          node scripts/release-e2e.mjs --tarball "$t" --out e2e-published
          code=$?
          node scripts/release-e2e-summary.mjs e2e-published >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" != "0" ] && [ "$code" != "2" ]; then exit 1; fi
          # Exit 2 means some steps were NOT_CHECKED. The gate fails the job unless each one is NOT_CHECKED
          # by design on this machine (see the script); a rate-limited check never counts as proven.
          node scripts/release-e2e-gate.mjs e2e-published
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-published-${{ matrix.os }}
          path: e2e-published
          if-no-files-found: ignore
