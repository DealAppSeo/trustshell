# The Chrome extension, loaded in a real Chromium, on every PR that touches it (B22).
#
# WHY THIS RUNS ON pull_request, unlike e2e-honesty.yml. That workflow stays off PRs because its
# suites build the Next app and talk to a server; a gate that reddens for environmental reasons
# gets ignored. This suite needs neither: it loads extension/ from disk and stubs every network
# call with context.route, so the only environmental dependency is the browser installed below.
#
# WHAT IT STOPS. Content scripts in one manifest entry share one global scope, and so do the
# service worker's importScripts files. Twice on 2026-10-04 a top-level `const api` redeclaration
# broke loading on four of five hosts while every unit test was green (BUS note N-LOAD-SCOPE).
# Jest loads each file as its own module and cannot see that; Chromium can.
#
# Exit 2 is NOT_CHECKED. Here, where the browser was just installed, a NOT_CHECKED means this job
# did not do its one job, so it fails the job rather than passing silently.

name: extension-e2e

on:
  pull_request:
    paths:
      - 'extension/**'
      - 'tests/e2e/**'
      - '.github/workflows/extension-e2e.yml'
  workflow_dispatch:
    inputs:
      ref_note:
        description: 'Why this manual run? (recorded on the run itself)'
        required: false
        default: 'manual extension load check'

permissions:
  contents: read

jobs:
  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Note why this ran
        run: echo "ref_note = ${{ inputs.ref_note || 'pull_request' }}"

      - run: npm ci

      # Playwright is deliberately NOT a package dependency (see tests/e2e/chromium-path.mjs), so it
      # is installed here only, unsaved. Pinned to the version the agent sandbox carries
      # (/opt/node22/lib/node_modules/playwright, 1.56.1) so a local green and a CI green measure
      # the same driver against the same browser revision.
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Extension load, worker, menu and five hosts
        run: |
          set +e
          npm run test:extension-e2e
          code=$?
          if [ "$code" = 2 ]; then
            echo "::error::extension-e2e reported NOT_CHECKED where a browser was just installed. That is a failure of this job, not an absence of signal."
            exit 1
          fi
          exit $code
