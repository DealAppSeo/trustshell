# Publish @hyperdag/trustshell to npm — from CI, so build/test/publish never runs on a local machine.
#
# Trigger:  push a version tag matching package.json (e.g. `git tag v1.2.0 && git push --tags`)
#           or run manually from the Actions tab (with an optional dry-run).
# Requires: an npm TRUSTED PUBLISHER for @hyperdag/trustshell (npmjs.com → the package →
#           Settings → Trusted publishing): GitHub Actions, DealAppSeo / trustshell,
#           workflow `publish-sdk.yml`, environment blank. No npm token is used or needed.
#           The fields are case-sensitive, and renaming this file breaks the trust.
#
# The prepublishOnly script (sdk:build && sdk:test) is intentionally bypassed on publish
# (--ignore-scripts) because we run build + test as explicit, individually-visible steps first.
#
# TWO DEFECTS THIS FILE USED TO HAVE, both of which made a GREEN RUN MEANINGLESS:
#
# 1. It published with no `--tag`, so EVERY publish became `latest`. A prerelease
#    like 1.4.0-beta.1 would therefore have been handed to everyone running a
#    plain `npm install`, which is the opposite of what a prerelease is for. npm
#    does not special-case prereleases; the default really is `latest`.
#
#    Fixed, and the SAFE behaviour is now automatic rather than something a human
#    has to remember: the dist-tag is DERIVED from the version. A version with a
#    prerelease part (a `-`, per semver) publishes to `next`; a plain version
#    publishes to `latest`. Overriding to put a prerelease on `latest` is possible
#    but must be spelled out, and the run says so.
#
# 2. The dry-run step had no NODE_AUTH_TOKEN, so `dry_run=true` could not
#    authenticate and therefore could not tell you anything about the credential.
#    A green rehearsal proved the tarball packed and NOTHING about whether a real
#    publish would work — while looking exactly like a rehearsal that had checked.
#    That is the "NOT CHECKED and valid are both green runs" trap, and it was
#    built into the file that exists to prevent it.
#
#    Fixed with an explicit credential step that reports VERIFIED / NOT CHECKED /
#    FAILED into the job summary and FAILS THE RUN when it cannot check. An
#    unverifiable credential must never share an exit code with a verified one.
#    (That step checked a long-lived npm token. Defect 3 replaced the token.)
#
# 3. It published with a long-lived npm token in a repository secret. A token like
#    that can leak, never expires on its own, and works from anywhere.
#
#    Now it publishes through npm trusted publishing (OIDC): GitHub vouches for this
#    workflow and npm hands back a short-lived token for this one package. There is
#    no npm token in this file, deliberately. npm's OIDC step never fails out loud
#    (npm/cli lib/utils/oidc.js is "intended to never throw"); it falls back to
#    whatever token is configured. With no real token here, a broken trust makes
#    the publish fail, and nothing ships on an old credential by accident.
#
#    That silence is also why the credential step does the exchange itself.
#    `npm publish --dry-run` runs the same exchange and hides the result, and npm
#    says `npm whoami` "is not a check of trusted publishing permissions". So the
#    rehearsal asks the registry directly and reports VERIFIED / NOT CHECKED /
#    FAILED, as before.
name: publish-sdk

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack only — do not publish'
        type: boolean
        default: false
      dist_tag:
        description: 'npm dist-tag. Leave blank to derive it from the version (prerelease → next, otherwise latest).'
        type: string
        required: false
        default: ''
      allow_prerelease_on_latest:
        description: 'Danger: let a prerelease version take the `latest` tag. Almost always wrong.'
        type: boolean
        default: false

# Read-only for the whole run. Only the `publish` job, which installs nothing, may ask
# GitHub for an OIDC token (see that job).
permissions:
  contents: read

jobs:
  # Installs dependencies and runs their scripts, so it gets NO OIDC permission. A
  # dependency's install script here cannot ask npm for a publish token.
  build:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.tag.outputs.name }}
      version: ${{ steps.tag.outputs.version }}
      dist_tag: ${{ steps.tag.outputs.dist_tag }}
    steps:
      - uses: actions/checkout@v4

      # The SAME Node as the merge gate (check.yml). This was '20' while check.yml ran 22, so the
      # suite that is green on every PR failed here: the local-memory commands use the built-in
      # `node:sqlite` (Node 22.5+), and on 20 they answer NOT_CHECKED by design. Run 37235430913
      # (2026-10-04) stopped at Test SDK with 12 failures in exactly those suites, before any
      # publish step. tests/publish-node-version.test.ts keeps the two in step.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: npm install --legacy-peer-deps

      - name: Guard — tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          echo "package.json=$PKG  tag=$TAG"
          test "$PKG" = "$TAG" || { echo "::error::tag v$TAG does not match package.json $PKG"; exit 1; }

      # Decide the dist-tag BEFORE building, so a wrong one stops the run early
      # and is visible in the summary whether or not anything is published.
      - name: Resolve dist-tag
        id: tag
        env:
          REQUESTED: ${{ inputs.dist_tag }}
          ALLOW_PRERELEASE_ON_LATEST: ${{ inputs.allow_prerelease_on_latest }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          # semver: anything after a '-' is a prerelease. 1.4.0-beta.1 is; 1.4.0 is not.
          case "$VERSION" in *-*) IS_PRERELEASE=true ;; *) IS_PRERELEASE=false ;; esac

          if [ -n "${REQUESTED:-}" ]; then
            DIST_TAG="$REQUESTED"
            ORIGIN="requested explicitly"
          elif [ "$IS_PRERELEASE" = "true" ]; then
            DIST_TAG="next"
            ORIGIN="derived — $VERSION is a prerelease"
          else
            DIST_TAG="latest"
            ORIGIN="derived — $VERSION is not a prerelease"
          fi

          # The footgun this file exists to close: a prerelease must not become the
          # default install by accident. Explicit opt-in only.
          if [ "$IS_PRERELEASE" = "true" ] && [ "$DIST_TAG" = "latest" ] && [ "${ALLOW_PRERELEASE_ON_LATEST:-false}" != "true" ]; then
            echo "::error::Refusing to publish prerelease $VERSION to the 'latest' tag. Everyone running a plain \`npm install\` would get it. Re-run with allow_prerelease_on_latest=true if that is genuinely intended."
            exit 1
          fi

          # RELEASE HOLD. A standing "do not move `latest`" decision has to live in
          # the repository, not in someone's memory — and it has to gate the path
          # that takes no inputs. `git tag v1.4.0 && git push --tags` fires this
          # workflow with no form, no dry-run checkbox and no confirmation; a
          # workflow input cannot gate a trigger that supplies none, so the hold
          # is a committed file that every trigger path sees.
          #
          # Compared against the STRING "true" rather than used as a shell
          # boolean: a workflow_dispatch boolean arrives as the text "true" or
          # "false", and "false" is truthy in an `if:` expression. Exact string
          # comparison is right under both readings.
          if [ -f .release-hold ] && [ "$DIST_TAG" = "latest" ]; then
            echo "| **release hold** | **ACTIVE** — \`.release-hold\` is present |" >> "$GITHUB_STEP_SUMMARY"
            if [ "${DRY_RUN:-false}" = "true" ]; then
              echo "::warning::Release hold is ACTIVE. This rehearsal continues, but a real run would refuse to publish $VERSION to 'latest'."
            else
              echo "::error::Release hold is ACTIVE (.release-hold exists). Refusing to publish $VERSION to the 'latest' tag — that is what every plain \`npm install\` resolves to. Read .release-hold; lift the hold by deleting that file in its own commit, or publish to a different dist-tag."
              exit 1
            fi
          fi

          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"       >> "$GITHUB_OUTPUT"
          echo "dist_tag=$DIST_TAG"     >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
          {
            echo "### Publish plan"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| version | \`$VERSION\` |"
            echo "| prerelease | $IS_PRERELEASE |"
            echo "| **dist-tag** | **\`$DIST_TAG\`** ($ORIGIN) |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build SDK
        run: npm run sdk:build

      - name: Test SDK
        run: npm run sdk:test

      # Runs on EVERY path, dry or not. This is what would have caught a command
      # whose code was correct and whose file never entered the tarball.
      - name: Tarball contents
        run: |
          set -euo pipefail
          npm pack --dry-run 2>&1 | tee /tmp/pack.txt
          {
            echo "<details><summary>Tarball contents</summary>"
            echo ""
            echo '```'
            grep 'npm notice' /tmp/pack.txt | sed 's/^npm notice *//'
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      # The exact bytes the publish job ships. --ignore-scripts as on publish (there are no
      # pack-time scripts today); the build and tests above already ran as visible steps.
      - name: Pack
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pkg"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/pkg"
          ls -l "$RUNNER_TEMP/pkg"

      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/pkg/*.tgz
          if-no-files-found: error
          retention-days: 7

  # The only job that can get an npm publish token. It installs no dependencies and runs no
  # package scripts: it checks the trust, then publishes the tarball the build job packed.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets this job ask GitHub for the OIDC token npm trusted publishing exchanges
    env:
      PKG: ${{ needs.build.outputs.name }}
      VERSION: ${{ needs.build.outputs.version }}
      DIST_TAG: ${{ needs.build.outputs.dist_tag }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/download-artifact@v4
        with:
          name: npm-tarball
          path: pkg

      # THE CREDENTIAL LINE. Read this, not the green tick. It does the same token exchange
      # `npm publish` does (npm/cli lib/utils/oidc.js) and reports the answer, because npm
      # itself swallows a failed exchange. The npm token it gets back is thrown away.
      - name: Credential check (trusted publisher)
        id: cred
        run: |
          set -uo pipefail
          say() { echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            say "- npm credential: **NOT CHECKED — this job cannot ask GitHub for an OIDC token** (\`permissions: id-token: write\` is missing)"
            echo "::error::No GitHub OIDC token available. NOT CHECKED is not a pass — failing rather than reporting green."
            exit 1
          fi
          ID_TOKEN=$(curl -sS --fail -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r '.value // empty')
          if [ -z "$ID_TOKEN" ]; then
            say "- npm credential: **NOT CHECKED — GitHub did not issue an OIDC token**"
            echo "::error::GitHub returned no OIDC token. NOT CHECKED is not a pass."
            exit 1
          fi
          echo "::add-mask::$ID_TOKEN"
          URL="https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${PKG/\//%2f}"
          BODY=$(mktemp)
          CODE=$(curl -sS -o "$BODY" -w '%{http_code}' -X POST -H "Authorization: Bearer $ID_TOKEN" "$URL") || CODE=000
          TOKEN=$(jq -r '.token // empty' "$BODY" 2>/dev/null)
          [ -n "$TOKEN" ] && echo "::add-mask::$TOKEN"
          MSG=$(jq -r '.message // empty' "$BODY" 2>/dev/null)
          rm -f "$BODY"
          case "$CODE" in
            2??)
              if [ -n "$TOKEN" ]; then
                say "- npm credential: **VERIFIED** — npm's trusted publisher for \`$PKG\` accepted this workflow (no npm token stored anywhere)"
                say "  Whether it may \`npm publish\` directly, not only stage, is decided by the trusted publisher's *Allowed actions* and shows only at the real publish."
                echo "trusted publisher VERIFIED for $PKG"
              else
                say "- npm credential: **NOT CHECKED — npm answered $CODE without a token**"
                echo "::error::npm answered $CODE with no token. NOT CHECKED is not a pass."
                exit 1
              fi ;;
            4??)
              say "- npm credential: **FAILED** — npm refused this workflow for \`$PKG\` ($CODE: ${MSG:-no message})"
              say "  Check npmjs.com → the package → Settings → Trusted publishing: GitHub Actions, \`DealAppSeo\` / \`trustshell\`, workflow \`publish-sdk.yml\`, environment blank. The fields are case-sensitive."
              echo "::error::npm trusted publisher refused this workflow: $CODE ${MSG:-}"
              exit 1 ;;
            *)
              say "- npm credential: **NOT CHECKED — the npm registry did not answer ($CODE)**"
              echo "::error::npm registry unreachable or erroring ($CODE). NOT CHECKED is not a pass."
              exit 1 ;;
          esac

      # Trusted publishing needs npm 11.5.1+, and Node 22 ships npm 10. This job installs nothing
      # else, so the upgrade cannot change what the build job tested.
      - name: npm that can publish through OIDC
        run: |
          set -euo pipefail
          npm install -g npm@^11.5.1
          echo "- toolchain: node \`$(node --version)\`, npm \`$(npm --version)\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish — dry-run (manual only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail
          npm publish pkg/*.tgz --dry-run --provenance --access public --ignore-scripts --tag "$DIST_TAG"
          echo "- result: **DRY RUN** — nothing was published. dist-tag would be \`$DIST_TAG\`." >> "$GITHUB_STEP_SUMMARY"

      # No NODE_AUTH_TOKEN: npm exchanges this job's OIDC token itself.
      # --provenance is explicit on purpose. npm 11 turns provenance on by itself for a public repo
      # and package, but inside a catch that only logs at verbose level (oidc.js), so a failure there
      # would ship the version without provenance and say nothing. Explicit, it fails the publish.
      # Provenance needs package.json `repository.url` to match this repository exactly.
      - name: Publish to npm
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          set -euo pipefail
          npm publish pkg/*.tgz --provenance --access public --ignore-scripts --tag "$DIST_TAG"
          echo "- result: **PUBLISHED** \`$VERSION\` to dist-tag \`$DIST_TAG\`." >> "$GITHUB_STEP_SUMMARY"
