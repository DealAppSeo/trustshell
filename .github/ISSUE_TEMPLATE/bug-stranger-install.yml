name: Bug — stranger install
description: npm install / CLI / MCP did not work as documented
title: "[stranger-install] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For a cold install. Every release that `npm view @hyperdag/trustshell versions` lists should install; if one of those 404s, that IS a bug, so report it. Paste what `npm view @hyperdag/trustshell version` prints below, so we know which release you got.
  - type: dropdown
    id: path
    attributes:
      label: What did you run?
      options:
        - npm install @hyperdag/trustshell
        - github:DealAppSeo/trustshell
        - npx trustshell verify
        - npx trustshell-mcp
        - example-agent clone
    validations:
      required: true
  - type: textarea
    id: commands
    attributes:
      label: Exact commands and output
      description: Paste the four-command path if you tried it (verify Paris, verify Rome, getRepID, presentProof --verify).
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: node -v, npm -v, and npm view @hyperdag/trustshell version
    validations:
      required: true
